<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0F172A" />
<title>Bayhaqy Arcade — Mini Games Collection</title>
<meta name="description" content="A collection of 7 mini games built with HTML5 Canvas. Angry Birds, Tetris, Flappy Bird, 2048, Stack Tower, Color Switch, and Gravity Flip — each with progressive level systems." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0F172A;
    --bg-2: #1E293B;
    --bg-3: #334155;
    --fg: #F1F5F9;
    --muted: #94A3B8;
    --accent: #DC2626;
    --accent-2: #F59E0B;
    --green: #10B981;
    --shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    --radius: 14px;
  }
  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(220, 38, 38, 0.10), transparent 60%),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(245, 158, 11, 0.06), transparent 50%),
      var(--bg);
    background-attachment: fixed;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 1.25rem;
  }

  /* Header */
  .site-header {
    padding: 3rem 0 1.5rem;
    text-align: center;
    border-bottom: 1px solid rgba(241, 245, 249, 0.06);
    margin-bottom: 2rem;
  }
  .site-eyebrow {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 0.3rem 0.8rem;
    border: 1px solid rgba(220, 38, 38, 0.3);
    border-radius: 999px;
    background: rgba(220, 38, 38, 0.06);
    margin-bottom: 1rem;
  }
  .site-title {
    font-size: clamp(2rem, 5vw, 3.25rem);
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.05;
    margin-bottom: 0.6rem;
  }
  .site-title .accent { color: var(--accent); }
  .site-subtitle {
    color: var(--muted);
    font-size: clamp(0.95rem, 1.6vw, 1.1rem);
    max-width: 620px;
    margin: 0 auto 1.2rem;
  }
  .site-stats {
    display: inline-flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 0.75rem;
    padding: 0.75rem 1.25rem;
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(241, 245, 249, 0.06);
    border-radius: 999px;
    font-size: 0.875rem;
  }
  .site-stats .stat-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--muted);
  }
  .site-stats .stat-pill strong {
    color: var(--fg);
    font-weight: 700;
  }
  .site-stats .stat-pill .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* Filter bar */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 2rem;
  }
  .filter-chip {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(241, 245, 249, 0.08);
    color: var(--muted);
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  .filter-chip:hover {
    background: rgba(51, 65, 85, 0.8);
    color: var(--fg);
    transform: translateY(-1px);
  }
  .filter-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* Games grid */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.25rem;
    margin-bottom: 3rem;
  }
  .game-card {
    position: relative;
    background: linear-gradient(160deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
    border: 1px solid rgba(241, 245, 249, 0.07);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
  }
  .game-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow), 0 0 0 1px var(--card-accent, var(--accent));
    border-color: var(--card-accent, var(--accent));
  }
  .game-card:hover .preview-canvas {
    transform: scale(1.04);
  }
  .game-card:hover .play-btn {
    background: var(--card-accent, var(--accent));
    color: #fff;
  }
  .preview {
    position: relative;
    aspect-ratio: 16 / 10;
    background: var(--preview-bg, #1E293B);
    overflow: hidden;
    border-bottom: 1px solid rgba(241, 245, 249, 0.06);
  }
  .preview-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transition: transform 0.4s ease;
    display: block;
  }
  .preview-emoji {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(3rem, 8vw, 4.5rem);
    text-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    pointer-events: none;
  }
  .genre-tag {
    position: absolute;
    top: 0.75rem;
    left: 0.75rem;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--fg);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    border: 1px solid rgba(241, 245, 249, 0.15);
  }
  .card-body {
    padding: 1.1rem 1.2rem 1.2rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .card-title {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--fg);
  }
  .card-desc {
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.45;
    flex: 1;
  }
  .card-progress {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.4rem;
    gap: 0.5rem;
  }
  .card-progress .levels {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
  }
  .card-progress .levels strong {
    color: var(--fg);
    font-weight: 700;
  }
  .stars {
    display: inline-flex;
    gap: 1px;
    font-size: 0.85rem;
    color: var(--accent-2);
    letter-spacing: 1px;
  }
  .stars .empty { color: rgba(241, 245, 249, 0.18); }
  .play-btn {
    margin-top: 0.7rem;
    background: rgba(241, 245, 249, 0.06);
    border: 1px solid rgba(241, 245, 249, 0.12);
    color: var(--fg);
    padding: 0.6rem 1rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 700;
    text-align: center;
    transition: background 0.18s, color 0.18s, transform 0.12s;
    pointer-events: none;
  }
  .game-card:active .play-btn {
    transform: scale(0.97);
  }

  /* Footer */
  .site-footer {
    padding: 2rem 0 3rem;
    text-align: center;
    border-top: 1px solid rgba(241, 245, 249, 0.06);
  }
  .site-footer a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.875rem;
    transition: color 0.18s;
  }
  .site-footer a:hover { color: var(--accent); }
  .site-footer .footer-text {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 0.5rem;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .site-header { padding: 2rem 0 1rem; }
    .games-grid { gap: 1rem; }
    .site-stats { gap: 1rem; padding: 0.6rem 1rem; font-size: 0.8rem; }
  }
  @media (max-width: 420px) {
    .container { padding: 0 1rem; }
    .filter-chip { padding: 0.4rem 0.85rem; font-size: 0.78rem; }
  }

  /* Reveal animation */
  .reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .reveal.in {
    opacity: 1;
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .game-card, .preview-canvas, .play-btn, .filter-chip { transition: none; }
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <span class="site-eyebrow">Mini Games Collection</span>
      <h1 class="site-title">Bayhaqy <span class="accent">Arcade</span></h1>
      <p class="site-subtitle">Seven handcrafted browser games — each with progressive levels, star ratings, and persistent progress. No installs, no ads, just play.</p>
      <div class="site-stats">
        <span class="stat-pill"><span class="dot"></span><strong>7</strong> Games</span>
        <span class="stat-pill"><span class="dot"></span><strong>70</strong> Levels</span>
        <span class="stat-pill"><span class="dot"></span><strong>210</strong> Stars to earn</span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="filter-bar" id="filterBar">
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="puzzle">Puzzle</button>
      <button class="filter-chip" data-filter="action">Action</button>
      <button class="filter-chip" data-filter="reflex">Reflex</button>
      <button class="filter-chip" data-filter="hypercasual">Hypercasual</button>
    </div>

    <section class="games-grid" id="gamesGrid">
      <!-- Cards injected by JS -->
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="https://bayhaqy.github.io/">← Back to portfolio</a>
      <p class="footer-text">© 2026 Achmad Bayhaqy. Built with HTML5 Canvas.</p>
    </div>
  </footer>

<script>
"use strict";

// ---------- Game catalog ----------
const GAMES = [
  {
    slug: "angry-birds",
    title: "Angry Birds",
    genre: "action",
    emoji: "🐦",
    accent: "#DC2626",
    previewBg: "linear-gradient(180deg, #7DD3FC 0%, #38BDF8 60%, #22C55E 60%, #16A34A 100%)",
    description: "Drag the slingshot, launch birds, pop all the pigs. 5 levels with wood and stone obstacles.",
    difficulty: 2,
    progressKey: null, // Angry Birds doesn't persist progress to localStorage
    totalLevels: 5,
  },
  {
    slug: "tetris",
    title: "Tetris",
    genre: "puzzle",
    emoji: "🟦",
    accent: "#00F0F0",
    previewBg: "linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%)",
    description: "The timeless classic. 10 levels with varied objectives — clear lines, score points, survive, or chase Tetrises.",
    difficulty: 3,
    progressKey: "tetris_progress",
    totalLevels: 10,
  },
  {
    slug: "flappy-bird",
    title: "Flappy Bird",
    genre: "reflex",
    emoji: "🐤",
    accent: "#F59E0B",
    previewBg: "linear-gradient(180deg, #7DD3FC 0%, #38BDF8 50%, #22C55E 50%, #16A34A 100%)",
    description: "Tap to flap through pipes. 10 levels with moving gaps, oscillating pipes, and a chaos finale.",
    difficulty: 2,
    progressKey: "flappy_progress",
    totalLevels: 10,
  },
  {
    slug: "2048",
    title: "2048",
    genre: "puzzle",
    emoji: "🔢",
    accent: "#EDC22E",
    previewBg: "linear-gradient(135deg, #1E1B4B 0%, #0F172A 100%)",
    description: "Slide and merge tiles to climb from 128 all the way to 65536. 10 goal-tile levels with move-count star ratings.",
    difficulty: 2,
    progressKey: "g2048_progress",
    totalLevels: 10,
  },
  {
    slug: "stack-tower",
    title: "Stack Tower",
    genre: "hypercasual",
    emoji: "🏗️",
    accent: "#10B981",
    previewBg: "linear-gradient(180deg, #1E1B4B 0%, #0F172A 100%)",
    description: "Drop sliding blocks perfectly to build the tallest tower. Perfect drops preserve width. 10 height-target levels.",
    difficulty: 1,
    progressKey: "stack_progress",
    totalLevels: 10,
  },
  {
    slug: "color-switch",
    title: "Color Switch",
    genre: "reflex",
    emoji: "🎨",
    accent: "#7C3AED",
    previewBg: "linear-gradient(135deg, #4C1D95 0%, #1E1B4B 50%, #0F172A 100%)",
    description: "Bounce the ball up through colored obstacles. Switch colors to match. 10 levels with rotating + moving obstacles.",
    difficulty: 2,
    progressKey: "colorswitch_progress",
    totalLevels: 10,
  },
  {
    slug: "gravity-flip",
    title: "Gravity Flip",
    genre: "action",
    emoji: "🔄",
    accent: "#2563EB",
    previewBg: "linear-gradient(135deg, #1E3A8A 0%, #0F172A 100%)",
    description: "A novel runner where one tap flips gravity. Survive 30s to 180s across 10 levels of escalating chaos.",
    difficulty: 3,
    progressKey: "gravityflip_progress",
    totalLevels: 10,
  },
];

// ---------- Progress helpers ----------
function getProgress(game) {
  if (!game.progressKey) return null;
  try {
    const raw = localStorage.getItem(game.progressKey);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function getStarsEarned(game) {
  const p = getProgress(game);
  if (!p) return { total: 0, possible: game.totalLevels * 3, unlocked: 0 };
  let total = 0;
  let unlocked = 1; // level 1 always unlocked
  // Detect common shapes: { unlocked: N, stars: {1:3, 2:2, ...} }
  if (typeof p.unlocked === "number") {
    unlocked = p.unlocked;
  }
  if (p.stars && typeof p.stars === "object") {
    for (const k of Object.keys(p.stars)) {
      total += p.stars[k] || 0;
    }
  } else if (p.levels && typeof p.levels === "object") {
    for (const k of Object.keys(p.levels)) {
      const lvl = p.levels[k];
      if (lvl && typeof lvl.stars === "number") total += lvl.stars;
    }
  }
  return {
    total,
    possible: game.totalLevels * 3,
    unlocked: Math.min(unlocked, game.totalLevels),
  };
}

function formatDifficulty(n) {
  return "★".repeat(n) + "<span class='empty'>★</span>".repeat(3 - n);
}

function buildProgressHTML(game) {
  if (!game.progressKey) {
    return `<div class="card-progress">
      <span class="levels">5 levels</span>
      <span class="stars">★<span class="empty">★★</span></span>
    </div>`;
  }
  const s = getStarsEarned(game);
  if (s.unlocked <= 1 && s.total === 0) {
    return `<div class="card-progress">
      <span class="levels"><strong>${game.totalLevels}</strong> levels · fresh start</span>
      <span class="stars">${"★".repeat(0)}<span class="empty">${"★".repeat(3)}</span></span>
    </div>`;
  }
  return `<div class="card-progress">
    <span class="levels">Level <strong>${s.unlocked}</strong>/${game.totalLevels} · ${s.total}/${s.possible} stars</span>
    <span class="stars">${formatDifficulty(game.difficulty)}</span>
  </div>`;
}

// ---------- Card rendering ----------
function renderCards(filter) {
  const grid = document.getElementById("gamesGrid");
  grid.innerHTML = "";
  const filtered = filter === "all" ? GAMES : GAMES.filter(g => g.genre === filter);
  filtered.forEach((game, i) => {
    const card = document.createElement("a");
    card.className = "game-card reveal";
    card.href = `${game.slug}/`;
    card.style.setProperty("--card-accent", game.accent);
    card.style.setProperty("--preview-bg", game.previewBg);
    card.style.transitionDelay = `${i * 60}ms`;
    card.innerHTML = `
      <div class="preview" style="background: ${game.previewBg};">
        <canvas class="preview-canvas" data-slug="${game.slug}" width="320" height="200"></canvas>
        <span class="preview-emoji">${game.emoji}</span>
        <span class="genre-tag">${game.genre}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${game.title}</div>
        <div class="card-desc">${game.description}</div>
        ${buildProgressHTML(game)}
        <div class="play-btn">Play ${game.title} →</div>
      </div>
    `;
    grid.appendChild(card);
  });

  // Trigger reveal
  requestAnimationFrame(() => {
    document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));
  });

  // Draw mini-previews
  document.querySelectorAll(".preview-canvas").forEach(c => {
    const slug = c.dataset.slug;
    drawPreview(c, slug);
  });
}

// ---------- Mini preview animations ----------
function drawPreview(canvas, slug) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  let t = 0;
  let raf = null;

  function loop() {
    t += 0.016;
    draw(slug, ctx, W, H, t);
    raf = requestAnimationFrame(loop);
  }

  // Only animate when visible
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        if (!raf) loop();
      } else {
        if (raf) {
          cancelAnimationFrame(raf);
          raf = null;
        }
      }
    });
  }, { threshold: 0.1 });
  io.observe(canvas);

  // Stop when card hovered (preview-canvas already scales)
}

function draw(slug, ctx, W, H, t) {
  ctx.clearRect(0, 0, W, H);

  switch (slug) {
    case "angry-birds": drawAngryBirds(ctx, W, H, t); break;
    case "tetris": drawTetris(ctx, W, H, t); break;
    case "flappy-bird": drawFlappy(ctx, W, H, t); break;
    case "2048": draw2048(ctx, W, H, t); break;
    case "stack-tower": drawStack(ctx, W, H, t); break;
    case "color-switch": drawColorSwitch(ctx, W, H, t); break;
    case "gravity-flip": drawGravityFlip(ctx, W, H, t); break;
  }
}

// Each preview is a tiny stylized animated scene representing the game
function drawAngryBirds(ctx, W, H, t) {
  // sky already from CSS bg
  // Ground
  ctx.fillStyle = "#22C55E";
  ctx.fillRect(0, H * 0.7, W, H * 0.3);
  // Slingshot
  ctx.strokeStyle = "#78350F";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(60, H * 0.7);
  ctx.lineTo(70, H * 0.5);
  ctx.moveTo(80, H * 0.7);
  ctx.lineTo(70, H * 0.5);
  ctx.stroke();
  // Bird orbiting
  const bx = 70 + Math.cos(t * 1.5) * 18;
  const by = H * 0.5 + Math.sin(t * 1.5) * 10 - 8;
  drawBirdMini(ctx, bx, by, 12);
  // Pig
  drawPigMini(ctx, W - 70, H * 0.65, 18);
}
function drawBirdMini(ctx, x, y, r) {
  ctx.fillStyle = "#DC2626";
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  // belly
  ctx.fillStyle = "#FECACA";
  ctx.beginPath();
  ctx.arc(x, y + r * 0.3, r * 0.55, 0, Math.PI * 2);
  ctx.fill();
  // beak
  ctx.fillStyle = "#F59E0B";
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + r * 1.6, y - 3);
  ctx.lineTo(x + r * 1.6, y + 3);
  ctx.closePath();
  ctx.fill();
  // eye
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(x + r * 0.4, y - r * 0.3, r * 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(x + r * 0.5, y - r * 0.3, r * 0.15, 0, Math.PI * 2);
  ctx.fill();
}
function drawPigMini(ctx, x, y, r) {
  ctx.fillStyle = "#22C55E";
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  // snout
  ctx.fillStyle = "#16A34A";
  ctx.fillRect(x - r * 0.3, y, r * 0.6, r * 0.35);
  ctx.fillStyle = "#064E3B";
  ctx.beginPath();
  ctx.arc(x - r * 0.1, y + r * 0.18, r * 0.06, 0, Math.PI * 2);
  ctx.arc(x + r * 0.1, y + r * 0.18, r * 0.06, 0, Math.PI * 2);
  ctx.fill();
  // eyes
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(x - r * 0.35, y - r * 0.3, r * 0.18, 0, Math.PI * 2);
  ctx.arc(x + r * 0.35, y - r * 0.3, r * 0.18, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(x - r * 0.32, y - r * 0.3, r * 0.08, 0, Math.PI * 2);
  ctx.arc(x + r * 0.38, y - r * 0.3, r * 0.08, 0, Math.PI * 2);
  ctx.fill();
}

function drawTetris(ctx, W, H, t) {
  // Grid background
  ctx.strokeStyle = "rgba(241, 245, 249, 0.04)";
  ctx.lineWidth = 1;
  const cell = 20;
  for (let x = 0; x < W; x += cell) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += cell) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  // Falling pieces
  const pieces = [
    { shape: [[1,1,1,1]], color: "#00F0F0", x: 20, y: ((t * 30) % (H + 40)) - 40 },
    { shape: [[1,1],[1,1]], color: "#F0F000", x: 120, y: ((t * 30 + 60) % (H + 40)) - 40 },
    { shape: [[0,1,0],[1,1,1]], color: "#A000F0", x: 220, y: ((t * 30 + 120) % (H + 40)) - 40 },
    { shape: [[0,1,1],[1,1,0]], color: "#00F000", x: 80, y: ((t * 30 + 180) % (H + 40)) - 40 },
  ];
  for (const p of pieces) {
    ctx.fillStyle = p.color;
    for (let r = 0; r < p.shape.length; r++) {
      for (let c = 0; c < p.shape[r].length; c++) {
        if (p.shape[r][c]) {
          ctx.fillRect(p.x + c * cell, p.y + r * cell, cell - 1, cell - 1);
        }
      }
    }
  }
}

function drawFlappy(ctx, W, H, t) {
  // Pipes
  const pipeW = 36;
  const gap = 80;
  const scroll = (t * 40) % 120;
  for (let i = -1; i < 4; i++) {
    const x = i * 120 - scroll;
    const topH = 50 + (i % 2) * 30;
    ctx.fillStyle = "#16A34A";
    ctx.fillRect(x, 0, pipeW, topH);
    ctx.fillRect(x, topH + gap, pipeW, H - topH - gap);
    // pipe rim
    ctx.fillStyle = "#15803D";
    ctx.fillRect(x - 3, topH - 8, pipeW + 6, 8);
    ctx.fillRect(x - 3, topH + gap, pipeW + 6, 8);
  }
  // Ground
  ctx.fillStyle = "#FBBF24";
  ctx.fillRect(0, H - 14, W, 14);
  // Bird
  const bx = 50 + Math.sin(t * 4) * 6;
  const by = H / 2 + Math.sin(t * 2) * 18;
  ctx.fillStyle = "#F59E0B";
  ctx.beginPath();
  ctx.arc(bx, by, 12, 0, Math.PI * 2);
  ctx.fill();
  // wing
  ctx.fillStyle = "#D97706";
  ctx.beginPath();
  ctx.ellipse(bx - 4, by + 2, 6, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  // eye
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(bx + 4, by - 3, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(bx + 5, by - 3, 2, 0, Math.PI * 2);
  ctx.fill();
  // beak
  ctx.fillStyle = "#DC2626";
  ctx.beginPath();
  ctx.moveTo(bx + 10, by);
  ctx.lineTo(bx + 16, by - 2);
  ctx.lineTo(bx + 16, by + 4);
  ctx.closePath();
  ctx.fill();
}

function draw2048(ctx, W, H, t) {
  // 4x4 grid of tiles with values cycling
  const cellSize = 50;
  const gap = 6;
  const offsetX = (W - 4 * cellSize - 3 * gap) / 2;
  const offsetY = (H - 4 * cellSize - 3 * gap) / 2;
  // bg grid
  ctx.fillStyle = "rgba(30, 41, 59, 0.6)";
  ctx.fillRect(offsetX - 6, offsetY - 6, 4 * cellSize + 3 * gap + 12, 4 * cellSize + 3 * gap + 12);
  const colors = {
    2: "#EEE4DA", 4: "#EDE0C8", 8: "#F2B179", 16: "#F59563",
    32: "#F67C5F", 64: "#F65E3B", 128: "#EDCF72", 256: "#EDCC61",
    512: "#EDC850", 1024: "#EDC53F", 2048: "#EDC22E"
  };
  const textColors = { 2: "#776E65", 4: "#776E65" };
  const vals = [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4, 8, 16, 32, 64];
  const phase = Math.floor(t / 1.2) % vals.length;
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const idx = (r * 4 + c + phase) % vals.length;
      const v = vals[idx];
      const x = offsetX + c * (cellSize + gap);
      const y = offsetY + r * (cellSize + gap);
      ctx.fillStyle = colors[v] || "#DC2626";
      ctx.fillRect(x, y, cellSize, cellSize);
      ctx.fillStyle = textColors[v] || "#F9F6F2";
      const fs = v < 100 ? 22 : v < 1000 ? 18 : v < 10000 ? 14 : 11;
      ctx.font = `bold ${fs}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(v), x + cellSize / 2, y + cellSize / 2);
    }
  }
}

function drawStack(ctx, W, H, t) {
  // Tower of blocks growing
  const blockH = 18;
  const colors = ["#DC2626", "#F59E0B", "#10B981", "#06B6D4", "#7C3AED", "#EC4899"];
  const offset = Math.sin(t * 2) * 10;
  // ground
  ctx.fillStyle = "rgba(241, 245, 249, 0.06)";
  ctx.fillRect(0, H - 20, W, 20);
  // blocks
  const baseY = H - 20;
  for (let i = 0; i < 6; i++) {
    const w = 110 - i * 6;
    const x = W / 2 - w / 2 + (i === 5 ? offset : 0);
    const y = baseY - (i + 1) * blockH;
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(x, y, w, blockH - 2);
    // top highlight
    ctx.fillStyle = "rgba(255,255,255,0.2)";
    ctx.fillRect(x, y, w, 3);
  }
  // falling cut-off piece
  const fallY = (t * 50) % 100;
  ctx.fillStyle = colors[3];
  ctx.save();
  ctx.translate(W / 2 + 80, baseY - 30 + fallY);
  ctx.rotate(t * 3);
  ctx.fillRect(-25, -8, 50, 16);
  ctx.restore();
}

function drawColorSwitch(ctx, W, H, t) {
  // Obstacle ring
  const cx = W / 2;
  const cy = H / 2 - 10;
  const r = 50;
  const colors = ["#DC2626", "#F59E0B", "#10B981", "#3B82F6"];
  const rot = t * 1.2;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, rot + i * Math.PI / 2, rot + i * Math.PI / 2 + Math.PI / 2);
    ctx.lineWidth = 8;
    ctx.strokeStyle = colors[i];
    ctx.stroke();
  }
  // Ball bouncing
  const ballColorIdx = Math.floor(t / 1.5) % 4;
  const ballY = cy + 30 + Math.sin(t * 4) * 14;
  ctx.fillStyle = colors[ballColorIdx];
  ctx.beginPath();
  ctx.arc(cx + Math.cos(t * 2) * 20, ballY, 8, 0, Math.PI * 2);
  ctx.fill();
  // glow
  ctx.shadowColor = colors[ballColorIdx];
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(cx + Math.cos(t * 2) * 20, ballY, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawGravityFlip(ctx, W, H, t) {
  // Floor + ceiling
  ctx.fillStyle = "#3B82F6";
  ctx.fillRect(0, H - 16, W, 16);
  ctx.fillRect(0, 0, W, 16);
  // Spikes scrolling
  const scroll = (t * 50) % 60;
  ctx.fillStyle = "#DC2626";
  for (let i = -1; i < 6; i++) {
    const x = i * 60 - scroll;
    // floor spike
    ctx.beginPath();
    ctx.moveTo(x, H - 16);
    ctx.lineTo(x + 12, H - 30);
    ctx.lineTo(x + 24, H - 16);
    ctx.closePath();
    ctx.fill();
    // ceiling spike (offset)
    if (i % 2 === 0) {
      ctx.beginPath();
      ctx.moveTo(x + 30, 16);
      ctx.lineTo(x + 42, 30);
      ctx.lineTo(x + 54, 16);
      ctx.closePath();
      ctx.fill();
    }
  }
  // Ball flipping between floor and ceiling
  const flipPhase = Math.sin(t * 1.8);
  const ballY = flipPhase > 0 ? H - 28 : 28;
  const ballRotation = flipPhase > 0 ? 0 : Math.PI;
  ctx.save();
  ctx.translate(60, ballY);
  ctx.rotate(ballRotation);
  // two-tone ball
  ctx.fillStyle = "#3B82F6";
  ctx.beginPath();
  ctx.arc(0, 0, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#DBEAFE";
  ctx.beginPath();
  ctx.arc(0, 0, 10, Math.PI, Math.PI * 2);
  ctx.fill();
  // eye
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(3, -3, 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ---------- Filter wiring ----------
document.getElementById("filterBar").addEventListener("click", (e) => {
  const btn = e.target.closest(".filter-chip");
  if (!btn) return;
  document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  renderCards(btn.dataset.filter);
});

// ---------- Initial render ----------
renderCards("all");

// ---------- Re-read progress when window regains focus ----------
window.addEventListener("focus", () => {
  const active = document.querySelector(".filter-chip.active");
  renderCards(active ? active.dataset.filter : "all");
});
</script>
