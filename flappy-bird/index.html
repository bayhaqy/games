<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0F172A" />
<title>Flappy Bird — Bayhaqy Arcade</title>
<meta name="description" content="Flappy Bird with 10 progressive levels, parallax skies, and rainbow bird colors. Tap to flap, avoid the pipes." />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0F172A;
    --panel: #1E293B;
    --panel-2: #334155;
    --text: #F1F5F9;
    --muted: #94A3B8;
    --accent: #DC2626;
    --accent-2: #EF4444;
    --gold: #FBBF24;
    --green: #22C55E;
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
    --radius: 14px;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }

  /* === App layout === */
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
  }

  /* === Header === */
  header {
    height: 56px;
    flex: 0 0 56px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 12px;
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(241, 245, 249, 0.08);
    z-index: 30;
  }
  .back-link {
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background 0.15s, color 0.15s;
    justify-self: start;
    white-space: nowrap;
  }
  .back-link:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .game-title {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-align: center;
    white-space: nowrap;
  }
  .game-title .accent { color: var(--accent-2); }
  .mute-btn {
    justify-self: end;
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(241,245,249,0.1);
    color: var(--text);
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
  }
  .mute-btn:hover { background: rgba(255,255,255,0.12); }
  .mute-btn:active { transform: scale(0.94); }

  /* === Canvas stage === */
  main {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }
  canvas#game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  /* On wide screens, constrain the playfield to a portrait area and center it
     so the game feels like a mobile arcade rather than a stretched canvas. */
  @media (min-width: 768px) {
    main {
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.35);
      border-left: 1px solid rgba(241, 245, 249, 0.06);
      border-right: 1px solid rgba(241, 245, 249, 0.06);
    }
  }

  /* === In-game HUD === */
  .hud {
    position: absolute;
    top: 12px; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    pointer-events: none;
    z-index: 10;
    padding: 0 12px;
  }
  .pill {
    background: rgba(15, 23, 42, 0.7);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(241,245,249,0.12);
    line-height: 1;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .pill .lab {
    font-size: 10px;
    font-weight: 600;
    opacity: 0.65;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .pill .val { font-size: 16px; }
  .pill.accent { border-color: rgba(220,38,38,0.5); }

  .hud-buttons {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 8px;
    z-index: 11;
  }
  .hud-btn {
    width: 40px; height: 40px;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(241,245,249,0.12);
    color: var(--text);
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
  }
  .hud-btn:hover { background: rgba(220,38,38,0.35); }
  .hud-btn:active { transform: scale(0.94); }

  /* === Overlay (modals) === */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-y: auto;
  }
  .overlay.active { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid rgba(241,245,249,0.1);
    border-radius: 18px;
    padding: 22px 18px;
    max-width: 560px;
    width: 100%;
    box-shadow: var(--shadow);
    animation: pop 0.22s cubic-bezier(0.2, 1.2, 0.3, 1) both;
    max-height: calc(100% - 32px);
    overflow-y: auto;
  }
  @keyframes pop {
    from { transform: scale(0.92); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal h2 {
    font-size: 22px;
    margin-bottom: 6px;
    text-align: center;
    font-weight: 800;
    letter-spacing: 0.01em;
  }
  .modal .sub {
    color: var(--muted);
    text-align: center;
    font-size: 13px;
    margin-bottom: 16px;
  }

  /* === Level picker grid === */
  .levels-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .level-card {
    position: relative;
    background: linear-gradient(135deg, var(--panel-2), var(--panel));
    border: 1px solid rgba(241,245,249,0.08);
    border-radius: 14px;
    padding: 14px 10px 12px;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: transform 0.12s, border-color 0.15s, box-shadow 0.15s;
    overflow: hidden;
    font-family: inherit;
  }
  .level-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 80% -20%, var(--bird-color, transparent) 0%, transparent 60%);
    opacity: 0.45;
    pointer-events: none;
  }
  .level-card:hover:not(.locked) {
    transform: translateY(-2px);
    border-color: var(--bird-color, var(--accent));
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  .level-card:active:not(.locked) { transform: scale(0.97); }
  .level-card.locked {
    opacity: 0.55;
    cursor: not-allowed;
    filter: grayscale(0.4);
  }
  .level-num {
    font-size: 26px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
    position: relative;
  }
  .level-num .pre {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 2px;
  }
  .level-stars {
    font-size: 14px;
    letter-spacing: 2px;
    margin: 6px 0 4px;
    color: var(--gold);
    position: relative;
    min-height: 18px;
  }
  .level-stars .empty { color: rgba(241,245,249,0.18); }
  .level-meta {
    font-size: 11px;
    color: var(--muted);
    position: relative;
    line-height: 1.3;
  }
  .level-meta .best { color: var(--text); font-weight: 600; }
  .lock-icon {
    position: absolute;
    top: 8px; right: 10px;
    font-size: 14px;
    opacity: 0.8;
  }

  /* === Modal buttons === */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid rgba(241,245,249,0.1);
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
    min-width: 100px;
  }
  .btn:hover { background: #475569; }
  .btn:active { transform: scale(0.96); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .btn.ghost { background: transparent; }

  /* === Game over / complete stats === */
  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 12px 0 4px;
  }
  .result-stat {
    background: rgba(15,23,42,0.55);
    border: 1px solid rgba(241,245,249,0.08);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }
  .result-stat .lab {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .result-stat .val { font-size: 22px; font-weight: 800; }

  .star-display {
    text-align: center;
    font-size: 38px;
    letter-spacing: 6px;
    margin: 14px 0 6px;
    color: var(--gold);
    text-shadow: 0 2px 8px rgba(251,191,36,0.4);
  }
  .star-display .empty { color: rgba(241,245,249,0.18); text-shadow: none; }
  .result-message {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .result-message.success { color: var(--green); font-weight: 600; }

  /* === Get Ready / tutorial overlay === */
  .get-ready {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    pointer-events: none;
    z-index: 8;
    color: var(--text);
    text-align: center;
    padding: 20px;
  }
  .get-ready.active { display: flex; }
  .get-ready .title {
    font-size: 30px;
    font-weight: 800;
    text-shadow: 0 3px 10px rgba(0,0,0,0.6);
    letter-spacing: 0.02em;
  }
  .get-ready .hint {
    font-size: 15px;
    color: var(--muted);
    max-width: 320px;
    line-height: 1.4;
  }
  .get-ready .tap-icon {
    font-size: 44px;
    animation: bob 1s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* === Level badge (top-left of game during play) === */
  .level-badge {
    position: absolute;
    top: 60px; left: 12px;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(241,245,249,0.12);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    gap: 6px;
    z-index: 9;
  }
  .level-badge.active { display: inline-flex; }
  .level-badge .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--bird-color, var(--accent));
    box-shadow: 0 0 8px var(--bird-color, var(--accent));
  }

  /* === Toast for "Level Up!" mid-game === */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid var(--accent);
    color: #fff;
    padding: 16px 28px;
    border-radius: 14px;
    font-size: 22px;
    font-weight: 800;
    text-align: center;
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .toast .sub {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-top: 4px;
  }

  /* === Responsive === */
  @media (min-width: 600px) {
    header { height: 64px; flex: 0 0 64px; padding: 0 18px; }
    .game-title { font-size: 19px; }
    .back-link { font-size: 15px; }
    .levels-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .modal { padding: 26px 24px; }
    .modal h2 { font-size: 26px; }
  }
  @media (min-width: 900px) {
    .levels-grid { grid-template-columns: repeat(5, 1fr); }
  }
  @media (max-width: 389px) {
    .game-title { font-size: 15px; }
    .back-link { font-size: 12px; padding: 6px 8px; }
    .level-num { font-size: 22px; }
    .pill { padding: 6px 10px; font-size: 12px; }
    .pill .val { font-size: 14px; }
  }

  /* === Reset-progress button === */
  .footer-link {
    text-align: center;
    margin-top: 14px;
  }
  .footer-link button {
    background: none;
    border: 0;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    font-family: inherit;
    padding: 6px;
  }
  .footer-link button:hover { color: var(--accent-2); }
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="../" class="back-link">← Back to Games</a>
    <h1 class="game-title">Flappy <span class="accent">Bird</span></h1>
    <button class="mute-btn" id="muteBtn" title="Mute" aria-label="Toggle sound">🔊</button>
  </header>
  <main>
    <canvas id="game"></canvas>

    <!-- In-game HUD -->
    <div class="hud" id="hud" style="display:none">
      <div class="pill"><span class="lab">Score</span><span class="val" id="scoreVal">0</span></div>
      <div class="pill accent"><span class="lab">Pipes</span><span class="val" id="pipesVal">0/0</span></div>
    </div>
    <div class="hud-buttons" id="hudButtons" style="display:none">
      <button class="hud-btn" id="pauseBtn" title="Back to menu" aria-label="Back to menu">✕</button>
    </div>

    <div class="level-badge" id="levelBadge"><span class="dot"></span><span id="levelBadgeText">Level 1</span></div>

    <!-- Get Ready / tutorial -->
    <div class="get-ready" id="getReady">
      <div class="tap-icon">👆</div>
      <div class="title" id="getReadyTitle">Get Ready!</div>
      <div class="hint" id="getReadyHint">Tap, click, press Space or ↑ to flap. Avoid the pipes!</div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Overlays -->
    <div class="overlay active" id="levelPicker">
      <div class="modal">
        <h2>Select Level</h2>
        <p class="sub">10 levels · progressive difficulty · unlock by completing the previous</p>
        <div class="levels-grid" id="levelsGrid"></div>
        <div class="footer-link">
          <button id="resetBtn">Reset all progress</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="resultOverlay">
      <div class="modal" id="resultModal">
        <!-- filled dynamically -->
      </div>
    </div>
  </main>
</div>

<script>
(() => {
'use strict';

/* ============================================================
   CONSTANTS & LEVEL CONFIG
   ============================================================ */
const SAVE_KEY = 'flappy_progress';

const LEVELS = [
  { id:1,  pipes:5,  gap:200, speed:100, moving:false, oscillating:false, chaos:false, tutorial:true,  label:'Tutorial' },
  { id:2,  pipes:8,  gap:180, speed:120, moving:false, oscillating:false, chaos:false, label:'Warmup' },
  { id:3,  pipes:10, gap:160, speed:140, moving:false, oscillating:false, chaos:false, label:'Cruise' },
  { id:4,  pipes:12, gap:160, speed:160, moving:true,  oscillating:false, chaos:false, label:'Drift',   moveAmp:35, moveSpeed:0.9 },
  { id:5,  pipes:15, gap:140, speed:160, moving:false, oscillating:true,  chaos:false, label:'Pulse',   oscAmp:30, oscSpeed:1.4 },
  { id:6,  pipes:18, gap:140, speed:180, moving:true,  oscillating:false, chaos:false, label:'Sway',    moveAmp:45, moveSpeed:1.1 },
  { id:7,  pipes:20, gap:120, speed:180, moving:false, oscillating:true,  chaos:false, label:'Throb',   oscAmp:38, oscSpeed:1.6 },
  { id:8,  pipes:25, gap:120, speed:200, moving:true,  oscillating:true,  chaos:false, label:'Storm',   moveAmp:40, oscAmp:32, moveSpeed:1.0, oscSpeed:1.5 },
  { id:9,  pipes:30, gap:100, speed:200, moving:false, oscillating:false, chaos:false, label:'Tight' },
  { id:10, pipes:40, gap:100, speed:240, moving:true,  oscillating:true,  chaos:true,  label:'Chaos',   moveAmp:55, oscAmp:40, moveSpeed:1.3, oscSpeed:1.8 },
];

const BIRD_COLORS = [
  '#EF4444', // L1 red
  '#F97316', // L2 orange
  '#FACC15', // L3 yellow
  '#22C55E', // L4 green
  '#06B6D4', // L5 cyan
  '#3B82F6', // L6 blue
  '#A855F7', // L7 purple
  '#EC4899', // L8 pink
  '#F8FAFC', // L9 white
  '#FBBF24', // L10 gold
];

// Physics
const GRAVITY = 1500;        // px/s²
const FLAP_VELOCITY = -440;  // px/s upward impulse
const MAX_FALL = 720;        // terminal velocity
const BIRD_VISUAL_R = 16;
const BIRD_COLLISION_R = 12; // forgiving hitbox
const PIPE_WIDTH = 72;
const GROUND_HEIGHT = 78;
const PIPE_CAP_HEIGHT = 22;
const PIPE_CAP_OVERHANG = 4;
const CLOSE_CALL_DIST = 20;  // bird center within 20px of pipe edge

/* ============================================================
   CANVAS SETUP
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let CW = 0, CH = 0;          // logical width/height
let DPR = 1;

function resize() {
  const rect = canvas.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  CW = Math.max(320, Math.floor(rect.width));
  CH = Math.max(360, Math.floor(rect.height));
  canvas.width = Math.floor(CW * DPR);
  canvas.height = Math.floor(CH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // reposition bird x
  if (state.bird) state.bird.x = birdX();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

function birdX() { return CW * 0.28; }
function groundY() { return CH - GROUND_HEIGHT; }
function pipeSpacing() { return Math.max(CW * 0.62, 240); }

/* ============================================================
   PROGRESS / SAVE
   ============================================================ */
function defaultProgress() {
  return { unlocked: 1, best: {}, stars: {} };
}
function loadProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultProgress();
    const p = JSON.parse(raw);
    if (typeof p !== 'object' || p === null) return defaultProgress();
    return {
      unlocked: Math.max(1, Math.min(LEVELS.length, p.unlocked|0 || 1)),
      best: (p.best && typeof p.best === 'object') ? p.best : {},
      stars: (p.stars && typeof p.stars === 'object') ? p.stars : {},
    };
  } catch (e) { return defaultProgress(); }
}
function saveProgress() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {}
}
let progress = loadProgress();

/* ============================================================
   SOUND (Web Audio API)
   ============================================================ */
const Sound = {
  ctx: null,
  muted: false,
  init() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  setMuted(m) { this.muted = m; },
  _tone(type, freqStart, freqEnd, dur, vol) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.connect(g); g.connect(this.ctx.destination);
    o.type = type;
    o.frequency.setValueAtTime(freqStart, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur);
  },
  flap()  { this._tone('triangle', 600, 380, 0.10, 0.15); },
  score() { this._tone('square',   820, 1200, 0.09, 0.10); },
  hit()   { this._tone('sawtooth', 220, 60, 0.22, 0.22); },
  gameover() {
    if (this.muted || !this.ctx) return;
    [420, 320, 240, 170].forEach((f, i) => {
      const t = this.ctx.currentTime + i * 0.16;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.connect(g); g.connect(this.ctx.destination);
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.start(t); o.stop(t + 0.18);
    });
  },
  levelcomplete() {
    if (this.muted || !this.ctx) return;
    [523, 659, 784, 1047, 1319].forEach((f, i) => {
      const t = this.ctx.currentTime + i * 0.11;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.connect(g); g.connect(this.ctx.destination);
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.start(t); o.stop(t + 0.25);
    });
  },
};

/* ============================================================
   GAME STATE
   ============================================================ */
const state = {
  mode: 'menu',       // 'menu' | 'ready' | 'playing' | 'gameover' | 'complete'
  level: null,
  bird: null,
  pipes: [],
  clouds: [],
  hills: [],
  groundOffset: 0,
  hillsOffset: 0,
  cloudsOffset: 0,
  score: 0,
  closeCalls: 0,
  spawned: 0,         // number of pipes spawned this run
  lastTime: 0,
  spawnX: 0,          // x position where next pipe should spawn
  shake: 0,
  flashTime: 0,
};

function makeBird() {
  return {
    x: birdX(),
    y: CH * 0.42,
    vy: 0,
    rotation: 0,
    wingPhase: 0,
    alive: true,
  };
}

function makeCloud(x) {
  return {
    x: x,
    y: 30 + Math.random() * (CH * 0.35),
    scale: 0.6 + Math.random() * 0.8,
    speed: 8 + Math.random() * 10,
  };
}
function makeHill(x, layer) {
  return {
    x: x,
    layer: layer, // 0=back, 1=front
    h: 60 + Math.random() * 50,
    w: 120 + Math.random() * 80,
  };
}

function initBackground() {
  state.clouds = [];
  state.hills = [];
  // Seed clouds across full width
  let x = 0;
  while (x < CW + 200) {
    state.clouds.push(makeCloud(x));
    x += 120 + Math.random() * 80;
  }
  // Seed hills (2 layers)
  for (let layer = 0; layer < 2; layer++) {
    let hx = 0;
    const baseH = layer === 0 ? 50 : 75;
    while (hx < CW + 200) {
      state.hills.push({ x: hx, layer, h: baseH + Math.random() * 30, w: 130 + Math.random() * 70 });
      hx += 100 + Math.random() * 40;
    }
  }
}

/* ============================================================
   LEVEL CONTROL
   ============================================================ */
function startLevel(levelId) {
  const lvl = LEVELS[levelId - 1];
  state.level = lvl;
  state.bird = makeBird();
  state.pipes = [];
  state.score = 0;
  state.closeCalls = 0;
  state.spawned = 0;
  state.spawnX = CW + 80;          // first pipe spawns just off-screen right
  state.shake = 0;
  state.flashTime = 0;
  state.mode = 'ready';
  if (state.clouds.length === 0) initBackground();
  // Apply level bird color to badge
  const badge = document.getElementById('levelBadge');
  badge.style.setProperty('--bird-color', BIRD_COLORS[levelId - 1]);
  document.getElementById('levelBadgeText').textContent = `Level ${lvl.id} · ${lvl.label}`;
  updateHUD();
  showGetReady(lvl);
  // hide overlays
  hideOverlay('levelPicker');
  hideOverlay('resultOverlay');
  // show hud + badge
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('hudButtons').style.display = 'flex';
  badge.classList.add('active');
}

function showGetReady(lvl) {
  const gr = document.getElementById('getReady');
  const title = document.getElementById('getReadyTitle');
  const hint = document.getElementById('getReadyHint');
  if (lvl.tutorial) {
    title.textContent = 'Level 1 — Tutorial';
    hint.innerHTML = 'Tap, click, press <b>Space</b> or <b>↑</b> to flap.<br>Avoid the green pipes. Pass ' + lvl.pipes + ' to win!';
  } else {
    title.textContent = `Level ${lvl.id} — ${lvl.label}`;
    const feats = [];
    if (lvl.moving) feats.push('moving pipes');
    if (lvl.oscillating) feats.push('oscillating gaps');
    if (lvl.chaos) feats.push('chaos gaps');
    const featTxt = feats.length ? ` · ${feats.join(', ')}` : '';
    hint.innerHTML = `Gap ${lvl.gap}px · Speed ${lvl.speed}px/s${featTxt}<br>Pass <b>${lvl.pipes}</b> pipes to win.`;
  }
  gr.classList.add('active');
}

function hideGetReady() {
  document.getElementById('getReady').classList.remove('active');
}

function showToast(html, sub, duration=1600) {
  const t = document.getElementById('toast');
  t.innerHTML = html + (sub ? `<span class="sub">${sub}</span>` : '');
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

function updateHUD() {
  document.getElementById('scoreVal').textContent = state.score;
  const total = state.level ? state.level.pipes : 0;
  document.getElementById('pipesVal').textContent = `${state.score}/${total}`;
}

/* ============================================================
   PIPE LOGIC
   ============================================================ */
function spawnPipe() {
  const lvl = state.level;
  // Random gap position
  const margin = 60;
  const minY = margin;
  const maxY = groundY() - lvl.gap - margin;
  let gapY = minY + Math.random() * (maxY - minY);
  // Gap height (chaos mode: random)
  let gapHeight = lvl.gap;
  if (lvl.chaos) {
    gapHeight = Math.max(80, lvl.gap + (Math.random() * 60 - 30));
  }
  state.pipes.push({
    x: state.spawnX,
    gapY: gapY,
    gapHeight: gapHeight,
    baseGapY: gapY,
    baseGapHeight: gapHeight,
    passed: false,
    closeCalled: false,
    minDist: Infinity,
    movePhase: Math.random() * Math.PI * 2,
    oscPhase: Math.random() * Math.PI * 2,
  });
  state.spawned++;
  state.spawnX += pipeSpacing();
}

function updatePipes(dt) {
  const lvl = state.level;
  for (const p of state.pipes) {
    p.x -= lvl.speed * dt;
    // Moving pipes (translate gap up/down)
    if (lvl.moving) {
      p.movePhase += dt * (lvl.moveSpeed || 1.0);
      p.gapY = p.baseGapY + Math.sin(p.movePhase) * (lvl.moveAmp || 30);
    }
    // Oscillating gap height
    if (lvl.oscillating) {
      p.oscPhase += dt * (lvl.oscSpeed || 1.4);
      p.gapHeight = p.baseGapHeight + Math.sin(p.oscPhase) * (lvl.oscAmp || 30);
    }
  }
  // Remove off-screen pipes
  state.pipes = state.pipes.filter(p => p.x + PIPE_WIDTH > -20);
  // Spawn new pipes if needed
  if (state.spawned < lvl.pipes && state.spawnX < CW + pipeSpacing()) {
    // already scheduled; just ensure spawn timer logic
  }
  // Spawn next pipe when last spawned pipe has moved into view enough
  while (state.spawned < lvl.pipes && (state.pipes.length === 0 || state.pipes[state.pipes.length - 1].x < CW - pipeSpacing() + 80)) {
    spawnPipe();
  }
}

/* ============================================================
   COLLISION
   ============================================================ */
function circleRectHit(cx, cy, cr, rx, ry, rw, rh) {
  const closestX = Math.max(rx, Math.min(cx, rx + rw));
  const closestY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - closestX;
  const dy = cy - closestY;
  return (dx * dx + dy * dy) < (cr * cr);
}

function checkCollisions() {
  const b = state.bird;
  // Ground / ceiling
  if (b.y + BIRD_COLLISION_R >= groundY()) {
    b.y = groundY() - BIRD_COLLISION_R;
    return 'ground';
  }
  if (b.y - BIRD_COLLISION_R < 0) {
    b.y = BIRD_COLLISION_R;
    b.vy = 0;
  }
  // Pipes
  for (const p of state.pipes) {
    // Top pipe rect
    const topR = { x: p.x, y: 0, w: PIPE_WIDTH, h: p.gapY };
    const botR = { x: p.x, y: p.gapY + p.gapHeight, w: PIPE_WIDTH, h: groundY() - (p.gapY + p.gapHeight) };
    // Slightly forgiving: shrink pipe width by 2px each side for collision
    const fx = 2;
    if (circleRectHit(b.x, b.y, BIRD_COLLISION_R, topR.x + fx, topR.y, topR.w - 2*fx, topR.h) ||
        circleRectHit(b.x, b.y, BIRD_COLLISION_R, botR.x + fx, botR.y, botR.w - 2*fx, botR.h)) {
      return 'pipe';
    }
    // Track close call: distance from bird center to nearest gap edge while overlapping horizontally
    if (b.x + BIRD_COLLISION_R > p.x && b.x - BIRD_COLLISION_R < p.x + PIPE_WIDTH) {
      const dTop = Math.abs(b.y - p.gapY);
      const dBot = Math.abs(b.y - (p.gapY + p.gapHeight));
      const md = Math.min(dTop, dBot);
      if (md < p.minDist) p.minDist = md;
    }
    // Passing the pipe
    if (!p.passed && b.x > p.x + PIPE_WIDTH) {
      p.passed = true;
      state.score++;
      if (p.minDist < CLOSE_CALL_DIST && p.minDist > 0) {
        state.closeCalls++;
        p.closeCalled = true;
      }
      Sound.score();
      updateHUD();
      // Check level complete
      if (state.score >= state.level.pipes) {
        completeLevel();
        return 'complete';
      }
    }
  }
  return null;
}

/* ============================================================
   GAME LIFECYCLE
   ============================================================ */
function flap() {
  if (state.mode === 'ready') {
    state.mode = 'playing';
    hideGetReady();
  }
  if (state.mode !== 'playing') return;
  state.bird.vy = FLAP_VELOCITY;
  state.bird.wingPhase = 0;
  Sound.flap();
}

function gameOver(cause) {
  if (state.mode === 'gameover' || state.mode === 'complete') return;
  state.mode = 'gameover';
  state.bird.alive = false;
  state.shake = 14;
  state.flashTime = 0.18;
  Sound.hit();
  setTimeout(() => Sound.gameover(), 180);

  // Update best score (best = max pipes passed)
  const lid = state.level.id;
  const prevBest = progress.best[lid] || 0;
  if (state.score > prevBest) {
    progress.best[lid] = state.score;
    saveProgress();
  }
  // Show result after short delay (let death animation play)
  setTimeout(() => showResult(false), 700);
}

function completeLevel() {
  if (state.mode === 'complete') return;
  state.mode = 'complete';
  Sound.levelcomplete();

  // Compute stars
  let stars = 3;
  if (state.closeCalls >= 3) stars = 1;
  else if (state.closeCalls >= 1) stars = 2;

  const lid = state.level.id;
  // Save best
  const prevBest = progress.best[lid] || 0;
  if (state.score > prevBest) progress.best[lid] = state.score;
  // Save best stars
  const prevStars = progress.stars[lid] || 0;
  if (stars > prevStars) progress.stars[lid] = stars;
  // Unlock next
  if (lid < LEVELS.length && progress.unlocked < lid + 1) {
    progress.unlocked = lid + 1;
  }
  saveProgress();
  setTimeout(() => showResult(true, stars), 400);
}

function showResult(success, stars=0) {
  const modal = document.getElementById('resultModal');
  const lvl = state.level;
  const lid = lvl.id;
  const best = progress.best[lid] || 0;
  const bestStars = progress.stars[lid] || 0;

  let html = '';
  if (success) {
    html += `<h2 style="color:var(--green)">Level Complete!</h2>`;
    html += `<p class="sub">Level ${lid} · ${lvl.label}</p>`;
    // Star display
    let starHtml = '';
    for (let i = 0; i < 3; i++) {
      starHtml += i < stars ? '★' : '<span class="empty">★</span>';
    }
    html += `<div class="star-display">${starHtml}</div>`;
    let msg = '';
    if (stars === 3) msg = 'Flawless! No close calls.';
    else if (stars === 2) msg = `Good! ${state.closeCalls} close call${state.closeCalls===1?'':'s'}.`;
    else msg = `Passed! ${state.closeCalls} close calls — try for fewer.`;
    html += `<div class="result-message success">${msg}</div>`;
  } else {
    html += `<h2 style="color:var(--accent-2)">Game Over</h2>`;
    html += `<p class="sub">Level ${lid} · ${lvl.label}</p>`;
  }
  html += `<div class="result-stats">`;
  html += `<div class="result-stat"><div class="lab">Pipes Passed</div><div class="val">${state.score}/${lvl.pipes}</div></div>`;
  html += `<div class="result-stat"><div class="lab">Close Calls</div><div class="val">${state.closeCalls}</div></div>`;
  html += `<div class="result-stat"><div class="lab">Best Score</div><div class="val">${best}/${lvl.pipes}</div></div>`;
  let bestStarHtml = '';
  for (let i = 0; i < 3; i++) {
    bestStarHtml += i < bestStars ? '★' : '<span class="empty" style="color:rgba(241,245,249,0.18)">★</span>';
  }
  html += `<div class="result-stat"><div class="lab">Best Stars</div><div class="val" style="color:var(--gold);font-size:18px;letter-spacing:2px">${bestStarHtml}</div></div>`;
  html += `</div>`;

  html += `<div class="btn-row">`;
  html += `<button class="btn" id="btnMenu">Level Select</button>`;
  html += `<button class="btn primary" id="btnRetry">Retry</button>`;
  if (success && lid < LEVELS.length) {
    html += `<button class="btn primary" id="btnNext">Next Level →</button>`;
  }
  html += `</div>`;
  modal.innerHTML = html;
  showOverlay('resultOverlay');

  document.getElementById('btnMenu').onclick = () => { hideOverlay('resultOverlay'); openLevelPicker(); };
  document.getElementById('btnRetry').onclick = () => { hideOverlay('resultOverlay'); startLevel(lid); };
  if (success && lid < LEVELS.length) {
    document.getElementById('btnNext').onclick = () => { hideOverlay('resultOverlay'); startLevel(lid + 1); };
  }
}

function backToMenu() {
  state.mode = 'menu';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('hudButtons').style.display = 'none';
  document.getElementById('levelBadge').classList.remove('active');
  hideGetReady();
  openLevelPicker();
}

/* ============================================================
   LEVEL PICKER
   ============================================================ */
function openLevelPicker() {
  const grid = document.getElementById('levelsGrid');
  grid.innerHTML = '';
  LEVELS.forEach((lvl, idx) => {
    const card = document.createElement('button');
    card.className = 'level-card';
    const isUnlocked = progress.unlocked >= lvl.id;
    if (!isUnlocked) card.classList.add('locked');
    card.style.setProperty('--bird-color', BIRD_COLORS[idx]);
    const best = progress.best[lvl.id] || 0;
    const stars = progress.stars[lvl.id] || 0;
    let starHtml = '';
    for (let i = 0; i < 3; i++) {
      starHtml += i < stars ? '★' : '<span class="empty">★</span>';
    }
    const lockIcon = isUnlocked ? '' : '<div class="lock-icon">🔒</div>';
    card.innerHTML = `
      ${lockIcon}
      <div class="level-num"><span class="pre">LVL ${lvl.id}</span>${lvl.label}</div>
      <div class="level-stars">${starHtml}</div>
      <div class="level-meta">Pipes: ${lvl.pipes}<br><span class="best">Best ${best}/${lvl.pipes}</span></div>
    `;
    if (isUnlocked) {
      card.addEventListener('click', () => {
        Sound.init();
        startLevel(lvl.id);
      });
    }
    grid.appendChild(card);
  });
  showOverlay('levelPicker');
}

function showOverlay(id) { document.getElementById(id).classList.add('active'); }
function hideOverlay(id) { document.getElementById(id).classList.remove('active'); }

/* ============================================================
   INPUT
   ============================================================ */
function onInput(e) {
  Sound.init();
  if (state.mode === 'menu' || state.mode === 'gameover' || state.mode === 'complete') return;
  if (e) e.preventDefault();
  flap();
}
canvas.addEventListener('mousedown', onInput);
canvas.addEventListener('touchstart', onInput, { passive: false });
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    onInput();
  } else if (e.code === 'Escape') {
    if (state.mode === 'playing' || state.mode === 'ready') backToMenu();
  }
});

document.getElementById('pauseBtn').addEventListener('click', backToMenu);
document.getElementById('muteBtn').addEventListener('click', (e) => {
  Sound.init();
  Sound.muted = !Sound.muted;
  e.currentTarget.textContent = Sound.muted ? '🔇' : '🔊';
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Reset all Flappy Bird progress? Stars, scores, and unlocks will be cleared.')) {
    progress = defaultProgress();
    saveProgress();
    openLevelPicker();
  }
});

/* ============================================================
   UPDATE LOOP
   ============================================================ */
function update(dt) {
  // Background parallax always
  const lvl = state.level;
  const speed = lvl ? lvl.speed : 100;
  state.cloudsOffset += (speed * 0.15) * dt;
  state.hillsOffset += (speed * 0.45) * dt;
  state.groundOffset += speed * dt;

  // Clouds
  for (const c of state.clouds) {
    c.x -= c.speed * dt * 0.6;
    if (c.x + 80 * c.scale < -50) {
      c.x = CW + 50 + Math.random() * 100;
      c.y = 30 + Math.random() * (CH * 0.35);
      c.scale = 0.6 + Math.random() * 0.8;
    }
  }
  // Hills
  for (const h of state.hills) {
    const factor = h.layer === 0 ? 0.35 : 0.55;
    h.x -= speed * factor * dt;
    if (h.x + h.w < -50) {
      h.x = CW + 50 + Math.random() * 60;
    }
  }

  if (state.mode === 'ready') {
    // Bird hovers gently
    state.bird.wingPhase += dt * 12;
    state.bird.y = CH * 0.42 + Math.sin(state.bird.wingPhase * 0.5) * 8;
    state.bird.rotation = Math.sin(state.bird.wingPhase * 0.5) * 0.05;
  } else if (state.mode === 'playing') {
    // Bird physics
    state.bird.vy += GRAVITY * dt;
    if (state.bird.vy > MAX_FALL) state.bird.vy = MAX_FALL;
    state.bird.y += state.bird.vy * dt;
    // Rotation based on velocity
    let targetRot;
    if (state.bird.vy < 0) {
      targetRot = -0.45; // ~-26deg
    } else {
      targetRot = Math.min(Math.PI / 3, state.bird.vy / 600); // up to ~60deg
    }
    state.bird.rotation += (targetRot - state.bird.rotation) * 0.18;
    // Wing flap animation when rising
    if (state.bird.vy < 0) state.bird.wingPhase += dt * 22;
    else state.bird.wingPhase += dt * 6;
    // Pipes
    updatePipes(dt);
    // Collisions
    const hit = checkCollisions();
    if (hit === 'pipe' || hit === 'ground') gameOver(hit);
  } else if (state.mode === 'gameover') {
    // Bird falls to ground
    if (state.bird.y + BIRD_COLLISION_R < groundY()) {
      state.bird.vy += GRAVITY * dt;
      if (state.bird.vy > MAX_FALL) state.bird.vy = MAX_FALL;
      state.bird.y += state.bird.vy * dt;
      state.bird.rotation += dt * 4;
    } else {
      state.bird.y = groundY() - BIRD_COLLISION_R;
    }
    // Pipes keep scrolling slowly to a stop
    for (const p of state.pipes) p.x -= speed * 0.2 * dt;
  } else if (state.mode === 'complete') {
    // Bird does a little celebration hover
    state.bird.wingPhase += dt * 18;
    state.bird.y = state.bird.y + Math.sin(state.bird.wingPhase * 0.4) * 0.6;
    state.bird.rotation = -0.2;
  }

  // Shake decay
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);
  if (state.flashTime > 0) state.flashTime = Math.max(0, state.flashTime - dt);
}

/* ============================================================
   RENDER
   ============================================================ */
function drawSky() {
  // Sky gradient (lighter than body bg)
  const g = ctx.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, '#1E3A8A');
  g.addColorStop(0.55, '#3B82F6');
  g.addColorStop(1, '#93C5FD');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CW, CH);
}

function drawCloud(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.scale, c.scale);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(0, 0, 18, 0, Math.PI * 2);
  ctx.arc(20, -4, 22, 0, Math.PI * 2);
  ctx.arc(42, 0, 18, 0, Math.PI * 2);
  ctx.arc(22, 8, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawHill(h) {
  const y = groundY();
  ctx.fillStyle = h.layer === 0 ? 'rgba(30, 75, 45, 0.85)' : 'rgba(45, 100, 60, 0.95)';
  ctx.beginPath();
  ctx.moveTo(h.x, y);
  ctx.quadraticCurveTo(h.x + h.w / 2, y - h.h, h.x + h.w, y);
  ctx.closePath();
  ctx.fill();
}

function drawPipe(p) {
  const topH = p.gapY;
  const botY = p.gapY + p.gapHeight;
  const botH = groundY() - botY;
  const x = p.x;
  // Body gradient
  const bodyGrad = ctx.createLinearGradient(x, 0, x + PIPE_WIDTH, 0);
  bodyGrad.addColorStop(0, '#15803D');
  bodyGrad.addColorStop(0.18, '#22C55E');
  bodyGrad.addColorStop(0.55, '#4ADE80');
  bodyGrad.addColorStop(0.85, '#22C55E');
  bodyGrad.addColorStop(1, '#15803D');

  // Top pipe body
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(x, 0, PIPE_WIDTH, topH - PIPE_CAP_HEIGHT);
  // Top pipe cap
  ctx.fillRect(x - PIPE_CAP_OVERHANG, topH - PIPE_CAP_HEIGHT, PIPE_WIDTH + PIPE_CAP_OVERHANG * 2, PIPE_CAP_HEIGHT);

  // Bottom pipe body
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(x, botY + PIPE_CAP_HEIGHT, PIPE_WIDTH, botH - PIPE_CAP_HEIGHT);
  // Bottom pipe cap
  ctx.fillRect(x - PIPE_CAP_OVERHANG, botY, PIPE_WIDTH + PIPE_CAP_OVERHANG * 2, PIPE_CAP_HEIGHT);

  // Outline
  ctx.strokeStyle = '#14532D';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, 0, PIPE_WIDTH, topH - PIPE_CAP_HEIGHT);
  ctx.strokeRect(x - PIPE_CAP_OVERHANG, topH - PIPE_CAP_HEIGHT, PIPE_WIDTH + PIPE_CAP_OVERHANG * 2, PIPE_CAP_HEIGHT);
  ctx.strokeRect(x, botY + PIPE_CAP_HEIGHT, PIPE_WIDTH, botH - PIPE_CAP_HEIGHT);
  ctx.strokeRect(x - PIPE_CAP_OVERHANG, botY, PIPE_WIDTH + PIPE_CAP_OVERHANG * 2, PIPE_CAP_HEIGHT);

  // Highlight stripe
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(x + 8, 0, 5, topH - PIPE_CAP_HEIGHT);
  ctx.fillRect(x + 8, botY + PIPE_CAP_HEIGHT, 5, botH - PIPE_CAP_HEIGHT);
}

function drawGround() {
  const y = groundY();
  // Ground base
  ctx.fillStyle = '#DE9953';
  ctx.fillRect(0, y, CW, GROUND_HEIGHT);
  // Top grass strip
  ctx.fillStyle = '#22C55E';
  ctx.fillRect(0, y, CW, 12);
  ctx.fillStyle = '#15803D';
  ctx.fillRect(0, y + 10, CW, 4);
  // Diagonal stripes pattern
  const stripeW = 28;
  const offset = -(state.groundOffset % (stripeW * 2));
  ctx.fillStyle = '#CA8540';
  for (let sx = offset; sx < CW + stripeW * 2; sx += stripeW * 2) {
    ctx.beginPath();
    ctx.moveTo(sx, y + 16);
    ctx.lineTo(sx + stripeW, y + 16);
    ctx.lineTo(sx + stripeW - 10, y + GROUND_HEIGHT);
    ctx.lineTo(sx - 10, y + GROUND_HEIGHT);
    ctx.closePath();
    ctx.fill();
  }
  // Ground top outline
  ctx.strokeStyle = '#0F172A';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(CW, y);
  ctx.stroke();
}

function drawBird() {
  const b = state.bird;
  const color = BIRD_COLORS[(state.level.id - 1) % BIRD_COLORS.length];
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rotation);
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(0, 3, BIRD_VISUAL_R + 1, BIRD_VISUAL_R - 1, 0, 0, Math.PI * 2);
  ctx.fill();
  // Body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, 0, BIRD_VISUAL_R, 0, Math.PI * 2);
  ctx.fill();
  // Body outline
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Belly (lighter)
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(-2, 5, 8, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  // Wing (animated)
  const wingY = Math.sin(b.wingPhase) * 3;
  ctx.fillStyle = shade(color, -0.2);
  ctx.beginPath();
  ctx.ellipse(-5, 2 + wingY, 8, 6, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Eye white
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(7, -5, 5.5, 0, Math.PI * 2);
  ctx.fill();
  // Pupil
  ctx.fillStyle = '#0F172A';
  ctx.beginPath();
  ctx.arc(8.5, -5, 2.5, 0, Math.PI * 2);
  ctx.fill();
  // Eye highlight
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(9.2, -5.8, 0.8, 0, Math.PI * 2);
  ctx.fill();
  // Beak
  ctx.fillStyle = '#F59E0B';
  ctx.beginPath();
  ctx.moveTo(12, -2);
  ctx.lineTo(22, 0);
  ctx.lineTo(12, 4);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#B45309';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Beak split
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.moveTo(13, 1);
  ctx.lineTo(21, 0.5);
  ctx.stroke();
  ctx.restore();
}

function drawCloseCallIndicators() {
  // Brief flash on pipes marked as close-called
  for (const p of state.pipes) {
    if (p.closeCalled && p.passed) {
      const alpha = 0.5 + Math.sin(Date.now() * 0.02) * 0.3;
      ctx.fillStyle = `rgba(251, 191, 36, ${alpha * 0.3})`;
      ctx.fillRect(p.x, 0, PIPE_WIDTH, p.gapY);
      ctx.fillRect(p.x, p.gapY + p.gapHeight, PIPE_WIDTH, groundY() - (p.gapY + p.gapHeight));
    }
  }
}

function shade(hex, percent) {
  // percent: -1..1 (negative = darker)
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  if (percent < 0) {
    r = Math.round(r * (1 + percent));
    g = Math.round(g * (1 + percent));
    b = Math.round(b * (1 + percent));
  } else {
    r = Math.round(r + (255 - r) * percent);
    g = Math.round(g + (255 - g) * percent);
    b = Math.round(b + (255 - b) * percent);
  }
  return `rgb(${r},${g},${b})`;
}

function render() {
  ctx.save();
  // Screen shake
  if (state.shake > 0) {
    const sx = (Math.random() - 0.5) * state.shake;
    const sy = (Math.random() - 0.5) * state.shake;
    ctx.translate(sx, sy);
  }

  drawSky();
  // Clouds (back)
  for (const c of state.clouds) drawCloud(c);
  // Hills (back to front)
  for (const h of state.hills) if (h.layer === 0) drawHill(h);
  for (const h of state.hills) if (h.layer === 1) drawHill(h);

  // Pipes
  for (const p of state.pipes) drawPipe(p);

  // Ground (drawn after pipes so pipe bottoms tuck under)
  drawGround();

  // Close call indicators (over pipes)
  if (state.mode === 'playing' || state.mode === 'gameover' || state.mode === 'complete') {
    drawCloseCallIndicators();
  }

  // Bird
  if (state.bird) drawBird();

  // Flash overlay on hit
  if (state.flashTime > 0) {
    ctx.fillStyle = `rgba(220, 38, 38, ${state.flashTime * 1.5})`;
    ctx.fillRect(0, 0, CW, CH);
  }

  ctx.restore();
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
function loop(ts) {
  if (!state.lastTime) state.lastTime = ts;
  let dt = (ts - state.lastTime) / 1000;
  state.lastTime = ts;
  if (dt > 1 / 30) dt = 1 / 30; // cap dt
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  resize();
  initBackground();
  openLevelPicker();
  requestAnimationFrame(loop);
}
// Wait for layout
requestAnimationFrame(() => {
  resize();
  init();
});

// Expose for debugging
window.flappyState = state;

})();
</script>
</body>
</html>
